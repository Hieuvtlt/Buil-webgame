name: Check, Preview and Deploy game

on:
  push:
    branches:
      - main
      - preview/rung-ram-ven-ho
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy this verified build to the main GitHub Pages site'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-and-preview:
    name: Check + Build + Preview artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks + production build
        run: npm run check

      - name: Upload testable preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-preview-${{ github.sha }}
          path: dist
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy verified build
    needs: check-and-preview
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
